  <path d="M56 45c1.5 3 2 6 2 9M64 43v11M72 45c-1.5 3-2 6-2 9" fill="none" stroke="#B96832" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 眼睛 -->
  <ellipse cx="52" cy="69" rx="3.6" ry="4.8" fill="#3B2418"/>
  <ellipse cx="76" cy="69" rx="3.6" ry="4.8" fill="#3B2418"/>
  <circle cx="53.2" cy="67.4" r="1.15" fill="#FFF8ED"/>
  <circle cx="77.2" cy="67.4" r="1.15" fill="#FFF8ED"/>

