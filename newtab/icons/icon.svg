  <path d="M47 76c-4-1-7 0-9 2M47 81c-4 0-7 2-8 4M81 76c4-1 7 0 9 2M81 81c4 0 7 2 8 4" fill="none" stroke="#3B2418" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- 右上角星光：新标签页 / AI 的标记 -->
