<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25185F"/>
      <stop offset="0.52" stop-color="#5B3DF5"/>
      <stop offset="1" stop-color="#9268FF"/>
    </linearGradient>
    <linearGradient id="fur" x1="48" y1="38" x2="84" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD08A"/>
      <stop offset="0.55" stop-color="#F6A85C"/>
      <stop offset="1" stop-color="#EC8B45"/>
    </linearGradient>
    <radialGradient id="haze" cx="0" cy="0" r="1" gradientTransform="translate(24 18) rotate(46) scale(100)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="4" y="4" width="120" height="120" rx="31"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="31" fill="url(#bg)"/>
  <g clip-path="url(#squircle)">
    <rect x="4" y="4" width="120" height="120" fill="url(#haze)"/>
    <circle cx="112" cy="116" r="50" fill="#30D5E8" opacity="0.14"/>
    <path d="M-8 94C20 78 40 84 58 96C76 108 98 110 136 92" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.10"/>
  </g>

  <!-- 耳朵在头部之前画，头圆盖住耳根 -->
  <path d="M32 58 27 24 55 41Z" fill="url(#fur)" stroke="#3B2418" stroke-width="4" stroke-linejoin="round"/>
  <path d="M96 58 101 24 73 41Z" fill="url(#fur)" stroke="#3B2418" stroke-width="4" stroke-linejoin="round"/>
  <path d="M34.5 48 32 32 46 41Z" fill="#F28B91" opacity="0.92"/>
  <path d="M93.5 48 96 32 82 41Z" fill="#F28B91" opacity="0.92"/>

  <circle cx="64" cy="72" r="33" fill="url(#fur)" stroke="#3B2418" stroke-width="4"/>
