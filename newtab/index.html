<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新标签页</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/widgets.css" />
  <link rel="stylesheet" href="css/settings.css" />
</head>
<body>
  <!-- 氛围层：低饱和光晕，给纯色底增加纵深 -->
  <div class="atmo" aria-hidden="true"></div>

  <!-- 顶部书签栏：仿谷歌首页「收藏的网址」一行，点击当前标签跳转 -->
  <div id="bm-bar" class="bm-bar">
    <div id="bm-bar-list" class="bm-bar-list">
      <!-- 书签由 JS 渲染 -->
    </div>
    <button id="bm-more" class="bm-more hidden" title="更多书签">»</button>
  </div>

  <!-- 本地目录树侧边栏（已禁用：改由资源监视面板占据左侧，功能保留可随时恢复） -->
  <aside id="tree-sidebar" class="nt-tree-sidebar-page hidden">
    <iframe id="tree-frame" src="tree.html" frameborder="0"></iframe>
    <button id="tree-toggle" class="tree-toggle-btn" title="收起目录树">‹</button>
  </aside>

  <!-- 系统资源监视面板（左侧常驻，与右侧 AI 管理器对称，host sysmon 轮询驱动） -->
  <aside id="sys-panel" class="sys-panel" aria-label="系统资源" aria-hidden="true">
    <div class="sys-head">
      <span class="sys-head-title">系统资源</span>
      <span class="sys-head-dot" id="sys-live" title="数据实时"></span>
      <button id="sys-refresh" class="sys-head-btn" title="刷新资源数据" aria-label="刷新资源数据">⟳</button>
      <button id="sys-close" class="sys-head-btn panel-close" title="关闭系统面板" aria-label="关闭系统面板">✕</button>
    </div>
    <div id="sys-metrics" class="sys-metrics">
      <!-- 由 JS 渲染：CPU/内存/GPU/交换/磁盘 占比条 + 走势 + 温度 -->
    </div>
  </aside>

  <!-- AI 应用管理器（右侧固定栏，Native Messaging host 驱动，常驻显示） -->
  <aside id="ai-panel" class="ai-panel" aria-label="AI 管理器" aria-hidden="true">
    <div class="ai-head">
      <span class="ai-head-title">AI 管理器</span>
      <span id="ai-status" class="ai-status">空闲</span>
      <button id="ai-refresh" class="ai-head-btn" title="刷新状态" aria-label="刷新 AI 状态">⟳</button>
      <button id="ai-close" class="ai-head-btn panel-close" title="关闭 AI 面板" aria-label="关闭 AI 面板">✕</button>
    </div>
    <div id="ai-banner" class="ai-banner hidden"></div>
    <div id="ai-app-list" class="ai-app-list">
      <!-- 由 JS 渲染：应用卡片（在线/任务中/离线） -->
    </div>
    <div id="ai-dialog-list" class="ai-dialog-list">
      <!-- 由 JS 渲染：待处理弹窗（确认/否认按钮） -->
    </div>
    <!-- 会话统计卡（替代完整历史消息流）：模型 / 累计 token / 轮次 / 最近请求 -->
    <div id="ai-session" class="ai-session">
      <!-- 由 JS 渲染：会话统计 -->
    </div>
  </aside>

  <!-- 抽屉态遮罩：点空白关闭浮层面板 -->
  <div id="panel-scrim" class="panel-scrim hidden" aria-hidden="true"></div>

  <!-- 右上角工具条（SVG 图标） -->
  <div class="toolbar" role="toolbar" aria-label="页面工具">
    <button id="btn-sys" class="tool-btn" title="显示/隐藏系统资源面板" aria-label="显示或隐藏系统资源面板" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
    </button>
    <button id="btn-ai" class="tool-btn" title="显示/隐藏 AI 管理器" aria-label="显示或隐藏 AI 管理器" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z"/><path d="M19 15l.7 2.1L22 18l-2.3.9L19 21l-.7-2.1L16 18l2.3-.9Z"/></svg>
    </button>
    <span class="tool-sep" aria-hidden="true"></span>
    <button id="btn-edit" class="tool-btn" title="编辑布局" aria-label="编辑布局">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <button id="btn-settings" class="tool-btn" title="设置" aria-label="打开设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </div>

  <!-- 小组件网格：外层负责左右让位，内层按可用宽度自适应列数 -->
  <div class="grid-shell">
    <main id="grid" class="grid">
      <!-- widget 卡片由 JS 注入 -->
    </main>
  </div>

  <!-- 编辑模式提示条 -->
  <div id="edit-hint" class="edit-hint hidden">
    编辑模式：拖拽卡片换位 · 点 ⟳ 切换尺寸 · 点 ✕ 删除 ·
    <button id="btn-edit-done" class="link-btn">完成</button>
  </div>

  <!-- 设置面板（覆盖层） -->
  <div id="settings" class="settings hidden" role="dialog" aria-modal="true" aria-label="设置" aria-hidden="true">
    <div class="settings-card">
      <div class="settings-head">
        <span>设置</span>
        <button id="settings-close" class="tool-btn" title="关闭" aria-label="关闭设置">✕</button>
      </div>

      <div class="settings-section">
        <h4>外观</h4>
        <label class="settings-row">
          <span>主题</span>
          <select id="s-theme">
            <option value="dark">深色</option>
            <option value="light">浅色</option>
          </select>
        </label>
        <label class="settings-row">
          <span>背景色</span>
          <select id="s-bg-color">
            <option value="default">默认（跟随主题）</option>
            <option value="#1a1d24">深空灰</option>
            <option value="#0f2027">深海蓝</option>
            <option value="#2d1b3d">暗夜紫</option>
            <option value="#1d2b1f">森林绿</option>
            <option value="#f2f4f8">云白</option>
            <option value="#fdf6ec">米纸色</option>
            <option value="#e8f0fe">淡天蓝</option>
            <option value="custom">自定义…</option>
          </select>
        </label>
        <label class="settings-row">
          <span>自定义颜色</span>
          <input id="s-bg-custom" type="color" value="#1e2129" />
        </label>
      </div>

      <div class="settings-section">
        <h4>布局</h4>
        <label class="settings-row">
          <span>系统资源面板</span>
          <input id="s-show-sys" type="checkbox" />
        </label>
        <label class="settings-row">
          <span>AI 管理器</span>
          <input id="s-show-ai" type="checkbox" />
        </label>
        <p class="settings-tip">宽屏停靠，窄屏以抽屉打开；关闭后仍可用右上角工具条重新打开。</p>
      </div>

      <div class="settings-section">
        <h4>添加小组件</h4>
        <div id="widget-add-list" class="widget-add-list">
          <!-- 由 JS 注入：registry 中各 widget 的添加按钮 -->
        </div>
      </div>

      <div class="settings-section">
        <h4>小组件配置</h4>
        <div id="widget-config-list" class="widget-config-list">
          <!-- 由 JS 注入：每个已有 widget 实例的配置表单 -->
        </div>
      </div>

      <div class="settings-section">
        <h4>便利贴联动</h4>
        <label class="settings-row">
          <span>便利贴扩展 ID</span>
          <input id="s-sticky-ext-id" type="text" placeholder="chrome://extensions 中查看" />
        </label>
        <p class="settings-tip">填写「程序员便利贴」扩展的 ID 后，任务小组件可读取并勾选便利贴的规划清单。</p>
      </div>

      <div class="settings-section">
        <button id="btn-reset" class="btn btn-danger">恢复默认布局</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
